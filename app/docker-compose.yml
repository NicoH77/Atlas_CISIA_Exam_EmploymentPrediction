version: "3.9"

services:

  mlflow:
    env_file:
      - .env

    image: ghcr.io/mlflow/mlflow:v3.3.0
    container_name: cisia_mlflow
    restart: unless-stopped

    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow-data/mlflow.db
      --artifacts-destination /mlflow/artifacts

    ports:
      - "5000:5000"

    volumes:
      - ./mlflow/mlflow-data:/mlflow/mlflow-data
      - ./mlflow/artifacts:/mlflow/artifacts

    networks:
      - cisia_network

  api:
    env_file:
      - .env

    build:
      context: ./api
      dockerfile: Dockerfile

    container_name: cisia_api
    restart: unless-stopped

    depends_on:
      - mlflow

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

    ports:
      - "8000:8000"

    volumes:
      - ./api/logs:/app/logs

    networks:
      - cisia_network

  streamlit:
    env_file:
      - .env

    build:
      context: ./ui
      dockerfile: Dockerfile

    container_name: cisia_streamlit
    restart: unless-stopped

    depends_on:
      - api

    ports:
      - "8501:8501"

    volumes:
      - ./ui/database:/app/database

    networks:
      - cisia_network

  prometheus:
    image: prom/prometheus:latest

    container_name: cisia_prometheus

    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - api

    networks:
      - cisia_network

  grafana:
    image: grafana/grafana:12.1.1

    container_name: cisia_grafana

    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - cisia_network


volumes:

  api_logs:
  streamlit_db:
  mlflow_db:
  mlflow_artifacts:
  grafana_data:

networks:
  cisia_network:
    driver: bridge